# ============================================
# A股量化选股系统 - 主配置文件
# ============================================
# 说明：此文件由 config.yaml.template 生成
# 不要提交此文件到Git仓库（已加入.gitignore）

data_dir: runtime/data

# 钉钉机器人配置
# 1. 在钉钉群中添加自定义机器人
# 2. 复制 webhook URL 和加签密钥
# 3. 填入下方（去掉引号内的占位符）
dingtalk:
  webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN_HERE"
  secret: "YOUR_SECRET_HERE"

# 定时任务配置
schedule:
  time: "17:00"  # 每日执行时间

# 数据更新配置
update:
  lookback_days: 10
  skip_failed: true

# 股票过滤配置
filters:
  # 最小市值（亿元）
  min_market_cap: 10
  # 最大市值（亿元）
  max_market_cap: 10000
  # 最小流通股本（亿股）
  min_float_shares: 1
  # 最大流通股本（亿股）
  max_float_shares: 100
  # 排除新股（上市天数）
  exclude_new_stock_days: 60
  # 排除ST股票
  exclude_st: true
  # 排除退市风险股票
  exclude_delisting_risk: true

# 交易配置
trading:
  # 初始资金（元）
  initial_capital: 300000.0

# 盘中实时模拟盘配置（paper_trading 模块）
paper_trading:
  # 模拟盘数据库（统一存放于 runtime/data，与 KHunter 库隔离）
  db_path: runtime/data/paper_trading.db
  # 盘中轮询间隔（分钟）
  poll_interval_minutes: 2
  # 单票最大仓位（占总资产）
  max_position_pct: 0.20
  # 总持仓上限（占总资产）
  max_total_position_pct: 0.80
  # 候选池上限（只）
  max_candidates: 300
  # 择时策略（macd_bollinger=顺势宝；门禁失败时降级到 timing_fallback）
  timing_strategy: "macd_bollinger"
  timing_fallback: "bollinger"
  # 实时行情：优先 ak.stock_zh_a_spot_em 全市场
  use_spot_em: true
  spot_min_interval_sec: 3.0
  # 交易费率
  fee:
    commission_rate: 0.00025   # 佣金 万2.5
    commission_min: 5.0         # 佣金最低 5 元
    stamp_tax_rate: 0.001       # 印花税 卖出 千1
    transfer_fee_rate: 0.00001  # 过户费 沪市 万0.1
